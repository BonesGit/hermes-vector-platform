[package]
name = "vector-bridge"
version = "0.6.2"
edition = "2021"
rust-version = "1.75"
description = "Hermes Vector platform sidecar (HTTP + VectorBot)"
license = "MIT"
publish = false

[dependencies]
axum = "0.8"
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# nip06: Keys::from_mnemonic (--mnemonic-file / create). Not re-exported by vector_sdk::nostr.
# Caret so it unifies with vector_sdk 0.14's nostr-sdk. Do not use
# Vector's git nostr fork.
nostr = { version = "0.45.7", default-features = false, features = ["std", "nip06"] }
# Generate a 12-word BIP-39 phrase on --setup create (NIP-06). Same crate nostr 0.45 uses.
bip39 = { version = "=2.2.2", default-features = false, features = ["std", "rand"] }
# crates.io crate name uses an underscore. Exact-pin 0.14.0
# (publish SHA fd474f2d308c2d1b09bec655631aa61f96a09386, on
# VectorPrivacy/Vector). Lock resolves vector-core 0.13.1, whose
# nostr-connect is ^0.45.3. 0.13.1's publish SHA 854c594 is not on that
# repo; taken so the yanked nostr-connect 0.45.2 pin is gone.
# tor + i2p: runtime-selected via VECTOR_NETWORK (clearnet|tor|i2p).
# voice/whisper/xdc stay off.
vector_sdk = { version = "=0.14.0", features = ["tor", "i2p"] }
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
ureq = { version = "2", features = ["json"] }
