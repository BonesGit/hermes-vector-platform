name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test sidecar
        working-directory: bridge
        run: cargo test --locked
      - name: Build sidecar
        working-directory: bridge
        run: cargo build --release --locked

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Install Hermes + pytest
        run: |
          uv sync --project hermes-agent --frozen --group dev
          uv pip install --python hermes-agent/.venv/bin/python pyyaml
      - name: Plugin unit tests
        env:
          HERMES_AGENT_ROOT: ${{ github.workspace }}/hermes-agent
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
        run: hermes-agent/.venv/bin/python -m pytest tests/test_plugin_unit.py -q
