[package]
name = "vector-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Hermes Vector platform sidecar (identity CLI)"
license = "MIT"
publish = false

[dependencies]
serde_json = "1"
# nip06: Keys::from_mnemonic (--mnemonic-file). Not re-exported by vector_sdk::nostr.
nostr = { version = "=0.45.1", default-features = false, features = ["std", "nip06"] }
# From bridge/, ../../Vector is the sibling Vector checkout.
vector_sdk = { path = "../../Vector/crates/vector-sdk" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
