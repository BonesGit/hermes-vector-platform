[package]
name = "vector-bridge"
version = "0.3.0"
edition = "2021"
rust-version = "1.75"
description = "Hermes Vector platform sidecar (HTTP + VectorBot)"
license = "MIT"
publish = false

[dependencies]
axum = "0.8"
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# nip06: Keys::from_mnemonic (--mnemonic-file / create). Not re-exported by vector_sdk::nostr.
nostr = { version = "=0.45.1", default-features = false, features = ["std", "nip06"] }
# Generate a 12-word BIP-39 phrase on --setup create (NIP-06). Same crate nostr 0.45 uses.
bip39 = { version = "=2.2.2", default-features = false, features = ["std", "rand"] }
# crates.io crate name uses an underscore. Exact-pin 0.9.0: that publish's
# .cargo_vcs_info.json SHA (b9aeb8d5) is an ancestor of VectorPrivacy/Vector
# master. crates.io 0.10.0 was published from 7bf7d335, which is not on that
# remote — do not take it.
vector_sdk = "=0.9.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
ureq = { version = "2", features = ["json"] }
