name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      # GITHUB_WORKSPACE is .../hermes-vector-platform/hermes-vector-platform.
      # From <plugin>/bridge, ../../Vector is this workspace's Vector/ checkout —
      # the same layout as /home/anthony/projects/{hermes-vector-platform,Vector}.
      - uses: actions/checkout@v4
        with:
          path: hermes-vector-platform
      - uses: actions/checkout@v4
        with:
          repository: VectorPrivacy/Vector
          path: Vector
      - uses: dtolnay/rust-toolchain@stable
      - name: Test sidecar
        working-directory: hermes-vector-platform/bridge
        run: cargo test
      - name: Build sidecar
        working-directory: hermes-vector-platform/bridge
        run: cargo build --release

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python3 -m pip install pytest
      - name: Plugin unit tests
        run: python3 -m pytest tests/test_plugin_unit.py -q
