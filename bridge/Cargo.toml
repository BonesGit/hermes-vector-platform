[package]
name = "vector-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Hermes Vector platform sidecar (HTTP stub + identity CLI)"
license = "MIT"
publish = false

[dependencies]
axum = "0.8"
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# nip06: Keys::from_mnemonic (--mnemonic-file). Not re-exported by vector_sdk::nostr.
nostr = { version = "=0.45.1", default-features = false, features = ["std", "nip06"] }
# From bridge/, ../../Vector is the sibling Vector checkout.
vector_sdk = { path = "../../Vector/crates/vector-sdk" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
ureq = { version = "2", features = ["json"] }
