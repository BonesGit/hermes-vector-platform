[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-vector-platform"
version = "0.2.0"
description = "Vector (vectorapp.io) messaging platform plugin for Hermes Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hermes Vector Platform contributors" }]
dependencies = [
  # Runtime deps come from Hermes itself (httpx, gateway.*).
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.entry-points."hermes_agent.plugins"]
vector-platform = "adapter:register"

[tool.setuptools]
py-modules = ["adapter"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["bridge/*", "plugin.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
