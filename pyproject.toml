[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-vector-platform"
version = "0.5.1"
description = "Vector (vectorapp.io) messaging platform plugin for Hermes Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BonesGit" }]
dependencies = [
  # Runtime deps come from Hermes itself (httpx, gateway.*).
]

[project.urls]
Homepage = "https://github.com/BonesGit/hermes-vector-platform"
Repository = "https://github.com/BonesGit/hermes-vector-platform"
Changelog = "https://github.com/BonesGit/hermes-vector-platform/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.entry-points."hermes_agent.plugins"]
vector-platform = "hermes_vector_platform:register"

# Map this package onto the repo root so a pip install still has
# adapter.py + plugin.yaml + bridge/ next to each other — the same layout
# Hermes uses for a git-clone into ~/.hermes/plugins/vector-platform.
# Do not declare a top-level module named adapter: that put a generic
# `adapter` in site-packages and silently dropped package-data.
[tool.setuptools]
packages = ["hermes_vector_platform"]
include-package-data = false

[tool.setuptools.package-dir]
hermes_vector_platform = "."

[tool.setuptools.package-data]
hermes_vector_platform = [
  "plugin.yaml",
  "bridge/Cargo.toml",
  "bridge/Cargo.lock",
  "bridge/.gitignore",
  "bridge/src/*.rs",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
