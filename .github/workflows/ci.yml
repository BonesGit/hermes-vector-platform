name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test sidecar
        working-directory: bridge
        run: cargo test --locked
      - name: Build sidecar
        working-directory: bridge
        run: cargo build --release --locked

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Hermes + pytest
        run: python3 -m pip install -e hermes-agent pytest
      - name: Plugin unit tests
        env:
          HERMES_AGENT_ROOT: ${{ github.workspace }}/hermes-agent
          PYTHONPATH: ${{ github.workspace }}/hermes-agent
        run: python3 -m pytest tests/test_plugin_unit.py -q
