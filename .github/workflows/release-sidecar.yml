# Build vector-bridge for Linux and macOS and attach the binaries to a
# GitHub Release. Fired by a v* tag (e.g. git tag v0.4.0 && git push --tags)
# or workflow_dispatch against an existing tag.
#
# Assets the adapter downloads:
#   vector-bridge-<rust-target-triple>
#   SHA256SUMS
#
# Linux uses Ubuntu 22.04 so the glibc requirement stays older than 24.04.
# Those runners begin deprecation 2026-09-17; move to 24.04 before 2027-04.

name: Release sidecar

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach assets to (e.g. v0.4.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build sidecar
        working-directory: bridge
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage asset
        run: |
          set -euo pipefail
          mkdir -p dist
          src="bridge/target/${{ matrix.target }}/release/vector-bridge"
          dest="dist/vector-bridge-${{ matrix.target }}"
          test -f "$src"
          cp "$src" "$dest"
          chmod +x "$dest"
          name="$(basename "$dest")"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$name" > "${name}.sha256")
          else
            (cd dist && shasum -a 256 "$name" > "${name}.sha256")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vector-bridge-${{ matrix.target }}
          path: |
            dist/vector-bridge-${{ matrix.target }}
            dist/vector-bridge-${{ matrix.target }}.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Combined checksums
        run: |
          set -euo pipefail
          for t in \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            x86_64-apple-darwin \
            aarch64-apple-darwin
          do
            test -f "dist/vector-bridge-$t"
          done
          cat dist/vector-bridge-*.sha256 | sort > dist/SHA256SUMS
          rm -f dist/vector-bridge-*.sha256
          cat dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            dist/vector-bridge-x86_64-unknown-linux-gnu
            dist/vector-bridge-aarch64-unknown-linux-gnu
            dist/vector-bridge-x86_64-apple-darwin
            dist/vector-bridge-aarch64-apple-darwin
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: ${{ github.event_name == 'push' }}
